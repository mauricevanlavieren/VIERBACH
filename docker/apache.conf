<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/lib/vierbach/data>
    Require all denied
</Directory>
<Directory /var/lib/vierbach/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    <FilesMatch "(?i)\\.(php.*|phtml|phar|cgi|pl|py|sh|htaccess)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)\\.svg$">
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
    </FilesMatch>
</Directory>
